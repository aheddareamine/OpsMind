[project]
name = "opsmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aheddareamine", email = "amine.aheddare-etu@etu.univh2c.ma" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.0",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
opsmind = "opsmind:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
