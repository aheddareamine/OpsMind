services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_opsmind
    environment:
      POSTGRES_USER: opsmind_user
      POSTGRES_PASSWORD: opsmind_password
      POSTGRES_DB: opsmind_main_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
    - "5432:5432"

volumes:
  postgres_data: